<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FCFAF6">
  <title>Sketchy Snake VR 🥽✏️</title>

  <!-- Social & WebXR Metadata -->
  <meta property="og:title" content="Sketchy Snake VR 🥽✏️">
  <meta property="og:description" content="A 3D Spatial Sketchbook Snake game in WebXR for Meta Quest and Apple Vision Pro 🧡">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aunysillyme.github.io/sketchy-snake-vr/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@AunySillyMe">

  <!-- Fonts & Styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Rock-solid Global Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
</head>
<body>
  <div id="ui-container">
    <!-- Non-VR / Flat Screen HUD & Controls -->
    <header class="vr-header">
      <div class="header-left">
        <h1 class="logo">Sketchy Snake <span class="vr-badge">VR 🥽</span></h1>
        <p class="subtitle">3D Spatial Sketchbook Arcade</p>
      </div>
      <div class="vr-score-cards">
        <div class="card current">
          <span class="label">SCORE</span>
          <span id="score-display" class="val">0</span>
        </div>
        <div class="card best">
          <span class="label">BEST</span>
          <span id="best-display" class="val">0</span>
        </div>
      </div>
    </header>

    <!-- Desktop / Touch Navigation Hints -->
    <div id="desktop-instructions" class="instructions-panel">
      <div class="inst-content">
        <h3>✏️ How to Play</h3>
        <p><strong>Meta Quest / VR:</strong> Put on headset, click <em>ENTER VR</em> below, and use your controller thumbsticks!</p>
        <p><strong>Desktop / Phone:</strong> Use <strong>Arrow Keys / WASD</strong> (and <strong>Q / E</strong> for vertical height). Drag to orbit the 3D scene!</p>
        <div class="music-pill">
          <button id="music-toggle-btn" class="pill-btn">▶ Music: Blue Lightning ⚡</button>
          <button id="next-track-btn" class="pill-btn mini">⏭</button>
        </div>
      </div>
    </div>

    <!-- Enter VR Button Mount Point -->
    <div id="vr-button-mount"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
